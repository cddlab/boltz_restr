# boltz RGI RMSD-restraint example via rgi_utils.
#
# An RMSD restraint drives the Kabsch-superposed RMSD of a moving atom group
# (atom_selection_target) toward `target_rmsd`, measured against a reference PDB
# (ref_pdb + atom_selection_ref). It is minimized by the CG solver each step.
#
# 1) Generate a reference PDB (e.g. a vanilla prediction of the same sequence):
#      boltz predict <this file without restraints_config> --seed 0 \
#        --out_dir out_ref --model boltz2 --output_format mmcif
#      python -c "import gemmi,sys;s=gemmi.read_structure(sys.argv[1]);\
#        s.setup_entities();open('rmsd_ref.pdb','w').write(s.make_pdb_string())" \
#        out_ref/*/predictions/*/*.cif
# 2) Run with the RMSD restraint:
#      cd boltz_restr && boltz predict rmsd_example.yaml --seed 1 \
#        --out_dir out_rmsd_example --model boltz2
#
# Atoms are paired by IDENTITY (chain, resid, atom-name) when both sides expose
# names — boltz decodes them from ref_atom_name_chars — so the reference PDB's atom
# order need NOT match the tool's internal order. The selection DSL is chain/resid/
# index only, so a residue range selects ALL atoms of those residues; the two
# selections must resolve to the same atom set (a count mismatch, or a target atom
# with no matching (chain, resid, name) in the reference, is a hard error).
sequences:
  - protein:
      id: [A]
      sequence: ADKKLVVATDTAFVPFEFKQGDKYVGFDVDLWAAIAKELKLDYELKPMDFSGIIPALQTKNVDLALAGITITDERKKAIDFSDGYYKSGLLVMVKANNNDVKSVKDLDGKVVAVKSGTGSVDYAKANIKTKDLRQFPNIDNAYMELGTNRADAVLHDTPNILYFIKTAGNGQFKAVGDSLEAQQYGIAFPKGSDELRDKVNGALKTLRENGTYNEIYKKWFGTEPK
      msa: empty

restraints_config:
  verbose: true
  gpu: true                 # torch device: true=GPU, false=CPU  max_iter: 200
  method: "CG"

  rmsd_restraints_config:
    # Drive residues 90-180 to match the reference's residues 90-180 (RMSD -> 0).
    - ref_pdb: rmsd_ref.pdb
      target_rmsd: 0.0
      atom_selection_ref: "chain A and (resid 90 to 180)"
      atom_selection_target: "chain A and (resid 90 to 180)"
      start_sigma: 99999999    # optional; omit -> active at every step
      # weight: 1.0            # optional (default 1.0)
